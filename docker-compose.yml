services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      QDRANT_PATH: /home/app/data/qdrant
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - qdrant-data:/home/app/data/qdrant
      - model-cache:/home/app/.cache

volumes:
  qdrant-data:
  model-cache:
