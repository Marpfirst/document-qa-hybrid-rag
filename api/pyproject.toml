[project]
name = "kb-assistant-api"
version = "0.1.0"
description = "Internal Knowledge Assistant - hybrid RAG over uploaded SOP documents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "qdrant-client>=1.12",
    "fastembed>=0.4",
    "sentence-transformers>=3.3",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "google-genai>=0.3",
    "groq>=0.13",
    "openai>=1.54",
    "slowapi>=0.1.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "reportlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
